<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraryMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f6fa;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 10px 0;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #ecf0f1;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        a {
            color: #2980b9;
        }

        .filter {
            margin-bottom: 20px;
        }

        .filter a {
            display: inline-block;
            padding: 8px 12px;
            margin-right: 5px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
            background-color: white;
        }

        .filter a:hover {
            background-color: #ecf0f1;
        }

        .selected {
            font-weight: bold;
            background-color: #3498db !important;
            color: white;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }

        .error {
            text-align: center;
            padding: 50px;
        }

        .error h1 {
            font-size: 60px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>LibraryMS</h1>

            <a href="{{ url_for('home') }}">Trang chu</a>

            <a href="{{ url_for('books_page') }}">Danh sach sach</a>

            <a href="{{ url_for('api_books') }}">API</a>
        </div>

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
